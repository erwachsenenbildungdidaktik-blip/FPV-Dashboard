# Baut aus der Web-App die Android-App (APK) und das Windows-Programm (.exe)
# und legt beide auf die Release-Seite "apps-latest".
name: Apps bauen

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - "apps/**"
      - "tools/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

concurrency:
  group: apps
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        working-directory: apps/mobile
        run: npm ci
      - name: Web-App in das Android-Projekt kopieren
        working-directory: apps/mobile
        run: npm run sync
      - name: APK bauen
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PfpvVersionCode=${{ github.run_number }} -PfpvVersionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FPV-OPS-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: FPV-OPS-Android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        working-directory: apps/desktop
        run: npm ci
      - name: Programm bauen
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - name: Datei benennen
        shell: bash
        run: cp apps/desktop/release/*portable.exe FPV-OPS-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: FPV-OPS-Windows.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Alte Fassung entfernen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apps-latest --cleanup-tag --yes --repo "${{ github.repository }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-latest
          target_commitish: ${{ github.sha }}
          name: FPV OPS Apps (neuester Stand)
          prerelease: true
          files: |
            out/FPV-OPS-Android.apk
            out/FPV-OPS-Windows.exe
          body: |
            Automatisch gebaut aus dem Stand ${{ github.sha }}.

            **Android:** `FPV-OPS-Android.apk` auf dem Handy herunterladen und öffnen. Beim ersten Mal fragt Android, ob der Browser Apps installieren darf: erlauben. Updates installieren sich über die alte Fassung, die Daten bleiben.

            **Windows:** `FPV-OPS-Windows.exe` herunterladen und starten, keine Installation nötig. Das Programm ist nicht signiert, deshalb warnt Windows SmartScreen: *Weitere Informationen → Trotzdem ausführen*.
