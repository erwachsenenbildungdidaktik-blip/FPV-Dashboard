# Baut aus der Web-App die Android-App (APK) und legt sie auf die Release-Seite
# "apps-latest". Das Windows-Programm wird bewusst nicht hier gebaut und nicht
# veröffentlicht; es entsteht lokal (siehe README).
name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - "apps/**"
      - "tools/**"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - "apps/mobile/**"
      - "tools/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        working-directory: apps/mobile
        run: npm ci
      - name: Web-App in das Android-Projekt kopieren
        working-directory: apps/mobile
        run: npm run sync
      - name: APK bauen
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PfpvVersionCode=${{ github.run_number }} -PfpvVersionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FPV-OPS-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: FPV-OPS-Android.apk

  release:
    # Nur aus main veröffentlichen; im Pull Request wird nur gebaut.
    if: github.ref == 'refs/heads/main'
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Alte Fassung entfernen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apps-latest --cleanup-tag --yes --repo "${{ github.repository }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-latest
          target_commitish: ${{ github.sha }}
          name: FPV OPS Android-App (neuester Stand)
          prerelease: true
          files: |
            out/FPV-OPS-Android.apk
          body: |
            Automatisch gebaut aus dem Stand ${{ github.sha }}.

            **Android:** `FPV-OPS-Android.apk` auf dem Handy herunterladen und öffnen. Beim ersten Mal fragt Android, ob der Browser Apps installieren darf: erlauben. Updates installieren sich über die alte Fassung, die Daten bleiben.
